    />

    <!-- Google tag (gtag.js): o script do Google só é baixado depois do "Aceitar todos" (LGPD) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      // LGPD: medição só com consentimento (modo de consentimento do Google). A escolha fica salva
      // no navegador e é feita no aviso de cookies (src/components/CookieBanner.jsx).
      var escolhaCookies = null;
      try { escolhaCookies = localStorage.getItem("abanic_cookies"); } catch (e) {}
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: escolhaCookies === "aceito" ? "granted" : "denied",
      });
      gtag("js", new Date());
      gtag("config", "G-S39CBYTFS9");
      window.carregarGA = function () {
        if (window.__gaCarregado) return;
        window.__gaCarregado = true;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-S39CBYTFS9";
        document.head.appendChild(s);
      };
      if (escolhaCookies === "aceito") window.carregarGA();
    </script>
  </head>
